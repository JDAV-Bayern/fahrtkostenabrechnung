<form [formRoot]="form" (submit)="onSubmit()">
  <jdav-stepper linear>
    <cdk-step label="reisedaten" [stepControl]="form.meeting">
      <app-meeting-committee-step></app-meeting-committee-step>
    </cdk-step>
    <cdk-step label="teilnehmer_in" [stepControl]="form.participant">
      <app-participant-step></app-participant-step>
    </cdk-step>
    <cdk-step label="auslagen" [stepControl]="form.expenses.transport">
      <app-expenses-step></app-expenses-step>
    </cdk-step>
    <cdk-step label="auslagen-sonstiges" [stepControl]="form.expenses">
      <app-expenses-extra-step></app-expenses-extra-step>
    </cdk-step>
    <cdk-step label="zusammenfassung">
      <app-overview-step></app-overview-step>
    </cdk-step>
    <ng-template #submitButton>
      <button
        jdavButton
        type="submit"
        [disabled]="isRenderingPdf() || form().invalid()"
      >
        @if (isRenderingPdf()) {
          <app-progress-indicator></app-progress-indicator>
        } @else {
          PDF herunterladen
        }
      </button>
    </ng-template>
  </jdav-stepper>
</form>
