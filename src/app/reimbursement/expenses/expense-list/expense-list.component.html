<fieldset>
  <ng-content></ng-content>
  <div
    cdkDropList
    [cdkDropListData]="field()"
    [cdkDropListEnterPredicate]="enterPredicate()"
  >
    @for (expense of expenses(); track expense) {
      <div cdkDrag [cdkDragData]="expense" (cdkDragDropped)="drop($event)">
        @switch (expense.type) {
          @case ('transport') {
            <jdav-transport-expense-card
              [expense]="expense"
              (editRow)="openEditDialog(expense)"
              (deleteRow)="deleteExpense(expense)"
            />
          }
          @case ('material') {
            <jdav-material-expense-card
              [expense]="expense"
              (editRow)="openEditDialog(expense)"
              (deleteRow)="deleteExpense(expense)"
            />
          }
        }
      </div>
    }
  </div>
  <button jdavButton type="button" (click)="openCreateDialog()">
    <span class="material-symbols-outlined">add</span>
    Auslage hinzufügen
  </button>
</fieldset>
